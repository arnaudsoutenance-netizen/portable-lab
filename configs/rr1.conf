// ═══════════════════════════════════════════════════════════════════════════════
//  F2G TelcoLab — rr1.conf (eNB1 - PC1 192.168.1.100)
//  S1 Handover Configuration
//  Créé le: 2026-10-01
// ═══════════════════════════════════════════════════════════════════════════════

mac_cnfg =
{
  phr_cnfg = 
  {
    dl_pathloss_change = "dB3";
    periodic_phr_timer = 50;
    prohibit_phr_timer = 0;
  };
  ulsch_cnfg = 
  {
    max_harq_tx = 4;
    periodic_bsr_timer = 20;
    retx_bsr_timer = 320;
  };
  
  time_alignment_timer = -1;
};

phy_cnfg =
{
  phich_cnfg = 
  {
    duration  = "Normal";
    resources = "1/6"; 
  };

  pusch_cnfg_ded =
  {
    beta_offset_ack_idx = 6;
    beta_offset_ri_idx  = 6;
    beta_offset_cqi_idx = 6;
  };
  
  sched_request_cnfg =
  {
    dsr_trans_max = 64;
    period = 20;
    nof_prb = 1;
  };
  
  cqi_report_cnfg =
  { 
    mode = "periodic";
    simultaneousAckCQI = true;
    period = 40;
    m_ri = 8;
  };
};

cell_list =
(
  {
    cell_id = 0x01;
    tac = 0x0001;
    pci = 1;
    root_seq_idx = 204;
    dl_earfcn = 1450;
    
    // ════════════════════════════════════════════════════════════════════════
    // ⚡ HANDOVER ACTIVÉ
    // ════════════════════════════════════════════════════════════════════════
    ho_active = true;
    
    // Timeout handover (ms) - temps max pour compléter le HO
    t304 = 2000;
    
    // CA cells (pas utilisé)
    scell_list = ()

    // ════════════════════════════════════════════════════════════════════════
    // 📡 CELLULES VOISINES POUR MESURE
    // ════════════════════════════════════════════════════════════════════════
    meas_cell_list =
    (
      {
        // eNB1 (cette cellule)
        eci = 0x19B01;        // E-UTRAN Cell ID = enb_id << 8 | cell_id
        dl_earfcn = 1450;
        pci = 1;
      },
      {
        // eNB2 (cellule cible pour handover)
        eci = 0x19C01;        // enb_id=0x19C, cell_id=0x01
        dl_earfcn = 1450;     // Même fréquence = intra-frequency HO
        pci = 2;              // PCI différent de eNB1
      }
    );

    // ════════════════════════════════════════════════════════════════════════
    // 📊 CONFIGURATION MEASUREMENT REPORT (A3 Event)
    // ════════════════════════════════════════════════════════════════════════
    meas_report_desc =
    (
      {
        // A3 Event: Neighbour becomes offset better than serving
        eventA = 3;
        
        // Offset en dB - la cellule voisine doit être 6dB meilleure
        a3_offset = 6;
        
        // Hystérésis pour éviter le ping-pong
        hysteresis = 0;
        
        // Temps avant de déclencher le report (ms)
        // 480ms = ~0.5s de mesure stable avant HO
        time_to_trigger = 480;
        
        // Mesure utilisée: RSRP (puissance) ou RSRQ (qualité)
        trigger_quant = "RSRP";
        
        // Nombre max de cellules à reporter
        max_report_cells = 1;
        
        // Intervalle entre reports (ms)
        report_interv = 120;
        
        // Nombre de reports à envoyer
        report_amount = 1;
      }
    );

    // Configuration du filtrage des mesures
    meas_quant_desc = {
      rsrq_config = 4;
      rsrp_config = 4;
    };
  }
);

nr_cell_list =
(
  // Pas de cellules NR
);
